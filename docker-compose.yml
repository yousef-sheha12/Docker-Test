services:
  frontend:
    build:
      context: ./frontend/student-ui
      dockerfile: Dockerfile
    container_name: student-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/student-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend/StudentApi
      dockerfile: Dockerfile
    container_name: student-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=StudentDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
    volumes:
      - ./backend/StudentApi/appsettings.json:/app/appsettings.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: student-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver_data:
